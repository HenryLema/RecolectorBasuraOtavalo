<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Recolector Basura Otavalo — Flota en Tiempo Real</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      box-shadow: none !important;
      text-shadow: none !important;
      -webkit-box-shadow: none !important;
      filter: none !important;
      -webkit-filter: none !important;
    }
    html, body {
      height: 100%; width: 100%;
      margin: 0; padding: 0;
      font-family: Arial, sans-serif;
      font-size: 13px;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    #map { position: fixed; inset: 0; z-index: 0; }
    #top {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      padding: clamp(4px,1.5vw,8px) clamp(6px,2vw,12px);
      background: transparent;
      pointer-events: none;
    }
    #top > * { pointer-events: auto; }
    #topRow {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: clamp(4px,1.2vw,7px);
    }
    .chip {
      display: inline-flex;
      align-items: center;
      height: clamp(26px,5vw,34px);
      padding: 0 clamp(6px,1.8vw,11px);
      border: 1px solid rgba(200,200,200,.85);
      border-radius: 10px;
      font-size: clamp(10px,1.8vw,12px);
      background: rgba(255,255,255,.78);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      white-space: nowrap;
      line-height: 1;
      cursor: default;
      user-select: none;
    }
    button.chip {
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: background .12s;
    }
    button.chip:active { background: rgba(210,210,210,.95); transform: scale(.97); }
    button.chip.drawing-active {
      background: rgba(255, 220, 80, 0.92);
      border-color: #e0a800;
    }
    button.chip:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }
    .title-chip {
      height: auto;
      min-height: clamp(26px,5vw,34px);
      padding: clamp(3px,1vw,5px) clamp(6px,1.8vw,11px);
      white-space: normal;
      word-break: break-word;
      line-height: 1.25;
      max-width: 100%;
    }
    .busstate-pill {
      display: inline-block;
      padding: 1px clamp(5px,1.5vw,8px);
      border-radius: 8px;
      color: #fff;
      font-size: clamp(10px,1.8vw,12px);
      line-height: 1.4;
    }
    .busstate-pill.moving  { background: #008000; }
    .busstate-pill.stopped { background: #cc0000; }
    .bus-wrap {
      width: clamp(26px,5vw,34px);
      height: clamp(26px,5vw,34px);
      border-radius: 999px;
      display: flex; align-items: center; justify-content: center;
      transform: translate(-50%,-50%);
      border: none; outline: none;
      user-select: none;
    }
    .bus-wrap.moving  { background: #008000; }
    .bus-wrap.stopped { background: #cc0000; }
    .bus-emoji { font-size: clamp(14px,3vw,20px); line-height: 1; }
    .stop-icon {
      font-size: clamp(22px,4vw,32px);
      transform: translate(-50%,-50%);
      display: block; line-height: 1;
    }
    #map.draw-mode { cursor: crosshair !important; }
    #drawHint {
      position: fixed;
      bottom: clamp(60px,10vw,80px);
      left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.62);
      color: #fff;
      font-size: clamp(11px,2vw,13px);
      padding: 5px 14px;
      border-radius: 10px;
      z-index: 1500;
      pointer-events: none;
      display: none;
      white-space: nowrap;
    }
    #toast {
      position: fixed;
      bottom: clamp(60px,10vw,80px);
      left: 50%; transform: translateX(-50%);
      background: rgba(30,30,30,0.88);
      color: #fff;
      font-size: clamp(11px,2vw,13px);
      padding: 7px 18px;
      border-radius: 12px;
      z-index: 3000;
      pointer-events: none;
      display: none;
      text-align: center;
      max-width: 90vw;
      white-space: normal;
    }
    @keyframes pulse-ring {
      0%   { transform: translate(-50%,-50%) scale(0.7); opacity: 1; }
      70%  { transform: translate(-50%,-50%) scale(1.55); opacity: 0.25; }
      100% { transform: translate(-50%,-50%) scale(0.7); opacity: 1; }
    }
    @keyframes pulse-core {
      0%,100% { transform: translate(-50%,-50%) scale(1);    opacity: 0.92; }
      50%      { transform: translate(-50%,-50%) scale(0.82); opacity: 0.70; }
    }
    .solicitud-ring {
      width: 52px; height: 52px;
      border-radius: 50%;
      border-width: 3px; border-style: solid;
      position: absolute;
      animation: pulse-ring 1.4s ease-in-out infinite;
      pointer-events: none;
    }
    .solicitud-core {
      width: 22px; height: 22px;
      border-radius: 50%;
      position: absolute;
      animation: pulse-core 1.4s ease-in-out infinite;
      cursor: pointer;
    }
    .solicitud-timer {
      position: absolute;
      top: -18px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.55);
      color: #fff; font-size: 10px;
      font-family: Arial, sans-serif;
      padding: 1px 5px; border-radius: 6px;
      white-space: nowrap; pointer-events: none;
    }
    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip     { box-shadow: none !important; }
    .leaflet-marker-shadow { display: none !important; }
    .leaflet-popup-content { font-family: Arial,sans-serif !important; font-weight: normal !important; }
    .leaflet-marker-icon      { filter: none !important; -webkit-filter: none !important; }
    .leaflet-zoom-animated    { filter: none !important; -webkit-filter: none !important; }
    .leaflet-shadow-pane      { display: none !important; }
    .leaflet-marker-pane img  { filter: none !important; -webkit-filter: none !important; }
    .leaflet-top.leaflet-left  { display: none; }
    .leaflet-bottom.leaflet-right {
      bottom: clamp(12px,3vw,24px);
      right:  clamp(8px,2vw,14px);
    }
    .popup-wrap      { width: clamp(150px,40vw,200px); font-family: Arial,sans-serif; }
    .stop-popup-wrap { width: clamp(160px,42vw,210px); font-family: Arial,sans-serif; }
    .popup-title, .popup-line,
    .stop-popup-title, .stop-popup-line {
      display: block; color: #000; font-weight: normal;
      font-size: clamp(10px,2vw,12px); line-height: 1.4; margin: 3px 0;
    }
    .popup-title, .stop-popup-title { text-align: center; margin: 0 0 6px; font-weight: bold; }
    .popup-val { font-weight: normal; }
    .popup-val.moving  { color: #008000; font-weight: bold; }
    .popup-val.stopped { color: #cc0000; font-weight: bold; }
    #infoOverlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.28);
      display: none; align-items: center; justify-content: center;
      z-index: 2000; padding: clamp(8px,3vw,20px);
    }
    #infoModal {
      width: 100%;
      max-width: min(780px, calc(100vw - 16px));
      max-height: calc(100vh - 32px);
      overflow-y: auto; background: #fff;
      border: 1px solid rgba(210,210,210,.95);
      border-radius: clamp(10px,2vw,16px);
      padding: clamp(8px,2vw,14px) clamp(10px,2.5vw,16px);
      font-family: Arial,sans-serif; font-size: clamp(11px,1.8vw,13px);
      color: #000; -webkit-overflow-scrolling: touch;
    }
    #infoTopRow {
      display: flex; align-items: center;
      justify-content: space-between;
      gap: 10px; margin-bottom: clamp(6px,1.5vw,10px);
    }
    #infoTitle  { font-size: clamp(11px,1.8vw,13px); font-weight: normal; opacity: .9; }
    #infoClose  {
      padding: clamp(3px,1vw,5px) clamp(8px,2vw,12px);
      border: 1px solid #bbb; background: rgba(255,255,255,.95);
      border-radius: 9px; font-size: clamp(10px,1.8vw,12px);
      cursor: pointer; user-select: none; flex-shrink: 0;
      touch-action: manipulation;
    }
    #infoGrid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: clamp(8px,2vw,14px);
    }
    @media (max-width:480px) { #infoGrid { grid-template-columns: 1fr; } }
    .infoCol {
      border: 1px solid rgba(210,210,210,.85);
      border-radius: clamp(8px,1.5vw,12px);
      padding: clamp(7px,1.5vw,11px); background: #fff;
    }
    .infoColTitle {
      text-align: center; font-size: clamp(11px,1.8vw,13px);
      font-weight: bold; margin: 0 0 8px;
    }
    .infoLine {
      font-size: clamp(10px,1.7vw,12px); font-weight: normal; margin: 4px 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #map, .chip, .stop-icon { touch-action: manipulation; }
    .good-fix { color: #27ae60; font-weight: bold; }
    .bad-fix  { color: #e74c3c; font-weight: bold; }
  </style>
</head>
<body>
  <div id="top">
    <div id="topRow">
      <div class="chip title-chip">♻️ Recolector Basura — Otavalo</div>
      <div class="chip">🕐 Hora: <span id="hora">--</span></div>
      <div class="chip">📍 Vehículo: <span id="vehNum">1</span></div>
      <div class="chip">Estado:&nbsp;<span id="busState" class="busstate-pill stopped">Sin datos</span></div>
      <div class="chip">🛰️ Satélites: <span id="sats">--</span></div>
      <div class="chip">📐 Precisión: <span id="hdop">--</span></div>
      <button id="btnReload" class="chip">🔃 Recargar</button>
      <button id="btnToggleTrail" class="chip">🟢 Recorrido: Si</button>
      <button id="btnInfo" class="chip">ℹ️ Info</button>
    </div>
  </div>
  <div id="map"></div>
  <div id="drawHint">Toca el mapa para colocar tu solicitud</div>
  <div id="toast"></div>
  <div id="infoOverlay" aria-hidden="true">
    <div id="infoModal" role="dialog" aria-modal="true">
      <div id="infoTopRow">
        <div id="infoTitle">📊 Datos en Tiempo Real — Vehículo 1</div>
        <button id="infoClose">Cerrar</button>
      </div>
      <div id="infoGrid">
        <div class="infoCol">
          <div class="infoColTitle">📍 Posición GPS</div>
          <div id="infoPos"></div>
        </div>
        <div class="infoCol">
          <div class="infoColTitle">📡 Señal</div>
          <div id="infoSignal"></div>
        </div>
        <div class="infoCol">
          <div class="infoColTitle">🚗 Movimiento</div>
          <div id="infoMove"></div>
        </div>
        <div class="infoCol">
          <div class="infoColTitle">⏱️ Sistema</div>
          <div id="infoSys"></div>
        </div>
      </div>
    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import { getDatabase, ref, onValue, set, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-database.js";

// ─── Configuración ──────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyCZP36RLL7SEWvyLApKKFJzjjssNRe-_LE",
  authDomain: "recolectorbasuraotavalo.firebaseapp.com",
  databaseURL: "https://recolectorbasuraotavalo-default-rtdb.firebaseio.com",
  projectId: "recolectorbasuraotavalo",
  storageBucket: "recolectorbasuraotavalo.firebasestorage.app",
  messagingSenderId: "900064792007",
  appId: "1:900064792007:web:c88637de46577aed87dde2"
};

const TOTAL_VEHICLES = 1; // ← Cambia a 20 cuando agregues más
const VEHICLE_BASE_PATH = "Recolector/Otavalo/Vehiculo";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ─── Audio ─────────────────────────────────────────────────────
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let _actx = null;
function getACtx() { if(!_actx) _actx = new AudioCtx(); return _actx; }
function playTone({freqs=[440], dur=0.1, type="sine", vol=0.15}) {
  try {
    const ctx = getACtx();
    freqs.forEach((f,i) => {
      const osc=ctx.createOscillator(), gain=ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type=type;
      osc.frequency.setValueAtTime(f, ctx.currentTime+i*0.06);
      gain.gain.setValueAtTime(vol, ctx.currentTime+i*0.06);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+i*0.06+dur);
      osc.start(ctx.currentTime+i*0.06);
      osc.stop(ctx.currentTime+i*0.06+dur+0.02);
    });
  } catch(e) {}
}
const soundReload = () => playTone({freqs:[880,660,440], dur:0.1, type:"square", vol:0.12});
const soundInfoOpen = () => playTone({freqs:[523,659,784], dur:0.13});
const soundInfoClose = () => playTone({freqs:[392,330], dur:0.09});
const soundTrailOn = () => playTone({freqs:[440,550,660], dur:0.1});
const soundTrailOff = () => playTone({freqs:[330,220], dur:0.12, type:"triangle"});

// ─── Utilidades ─────────────────────────────────────────────────
const safeNum = (v,d=6) => { const n=Number(v); return isFinite(n)?n.toFixed(d):"--"; };
const safeVal = v => (v===undefined||v===null||v===""||(typeof v==="number"&&!isFinite(v)))?"--":String(v);
const kmh = v => isFinite(Number(v)) ? `${Number(v).toFixed(1)} km/h` : "--";
const boolSiNo = v => (v===true||v==="true")?"Sí":"No";

function haversineMeters(lat1,lon1,lat2,lon2) {
  const R=6371000, toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

// ─── Mapa ───────────────────────────────────────────────────────
const map = L.map("map", { zoomControl:false }).setView([0.2311, -78.4835], 15);
L.control.zoom({position:"bottomright"}).addTo(map);
map.attributionControl.setPrefix("Red Otavalo Telecomunicaciones");
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom:19, detectRetina:true,
  attribution: "© OpenStreetMap"
}).addTo(map);

// ─── Marcador del vehículo ──────────────────────────────────────
const makeBusIcon = isMoving => L.divIcon({
  className:"",
  html: `<div class="bus-wrap ${isMoving?'moving':'stopped'}"><span class="bus-emoji">🚚</span></div>`,
  iconSize:[30,30], iconAnchor:[15,15]
});

const busMarker = L.marker([0.2311, -78.4835], { icon: makeBusIcon(false) }).addTo(map);
let lastLatLng = null;
let followEnabled = true;
let latestData = null;

// ─── Recorrido (línea) ──────────────────────────────────────────
const trailLatLngs = [];
const MAX_TRAIL_POINTS = 5000;
const MIN_ADD_DIST_M = 8; // Solo agrega si se mueve más de 8m → limpio
const trailLine = L.polyline([], { color:"#2ecc71", weight:4, opacity:0.7 }).addTo(map);
let trailVisible = true;

document.getElementById("btnToggleTrail").addEventListener("click", () => {
  trailVisible = !trailVisible;
  if(trailVisible) {
    soundTrailOn();
    trailLine.setLatLngs(trailLatLngs);
    document.getElementById("btnToggleTrail").textContent = "🟢 Recorrido: Sí";
  } else {
    soundTrailOff();
    trailLine.setLatLngs([]);
    document.getElementById("btnToggleTrail").textContent = "⚫ Recorrido: No";
  }
});

function addToTrail(lat, lon, speedKmh) {
  if(speedKmh < 1.0) return; // No dibuja cuando está quieto
  if(trailLatLngs.length === 0) {
    trailLatLngs.push([lat, lon]);
    if(trailVisible) trailLine.setLatLngs(trailLatLngs);
    return;
  }
  const last = trailLatLngs[trailLatLngs.length - 1];
  const dist = haversineMeters(last[0], last[1], lat, lon);
  if(dist >= MIN_ADD_DIST_M) {
    trailLatLngs.push([lat, lon]);
    if(trailLatLngs.length > MAX_TRAIL_POINTS) trailLatLngs.shift();
    if(trailVisible) trailLine.setLatLngs(trailLatLngs);
  }
}

// ─── Seguimiento de cámara ──────────────────────────────────────
map.on("dragstart", () => { followEnabled = false; });
map.on("zoomstart", () => { followEnabled = false; });

// ─── Renderizar datos ───────────────────────────────────────────
function renderBusData(d) {
  if(!d) return;
  latestData = d;

  // Extraer todos los campos con valores por defecto seguros
  const lat = Number(d.lat || 0);
  const lon = Number(d.lon || 0);
  const rawLat = Number(d.raw_lat || lat);
  const rawLon = Number(d.raw_lon || lon);
  const speedKmh = Number(d.speed_kmh || 0);
  const altM = Number(d.alt_m || 0);
  const sats = Number(d.satelites || 0);
  const hdop = Number(d.hdop || 0);
  const course = Number(d.course_deg || 0);
  const goodFix = Boolean(d.good_fix);
  const anchorActive = Boolean(d.anchor_active);
  const hora = d.hora_ecuador || "--";

  // Actualizar barra superior
  document.getElementById("hora").textContent = hora;
  document.getElementById("sats").textContent = sats > 0 ? sats : "--";
  document.getElementById("hdop").textContent = hdop > 0 ? hdop.toFixed(2) : "--";

  // Estado del vehículo
  const isMoving = speedKmh >= 1.0;
  const stateEl = document.getElementById("busState");
  stateEl.textContent = isMoving ? "En movimiento" : (anchorActive ? "Anclado" : "Detenido");
  stateEl.className = `busstate-pill ${isMoving ? "moving" : "stopped"}`;

  // Icono del marcador
  busMarker.setIcon(makeBusIcon(isMoving));
  busMarker.setLatLng([lat, lon]);

  // Popup con TODOS los datos
  busMarker.bindPopup(`
    <div class="popup-wrap">
      <span class="popup-title">🚛 Vehículo 1 — Recolector</span>
      <span class="popup-line">📍 Latitud: <strong>${lat.toFixed(7)}</strong></span>
      <span class="popup-line">📍 Longitud: <strong>${lon.toFixed(7)}</strong></span>
      <span class="popup-line">📏 Altura: <strong>${altM.toFixed(1)} m</strong></span>
      <span class="popup-line">🚀 Velocidad: <span class="popup-val ${isMoving?'moving':'stopped'}"><strong>${speedKmh.toFixed(1)} km/h</strong></span></span>
      <span class="popup-line">🧭 Rumbo: <strong>${course.toFixed(1)}°</strong></span>
      <span class="popup-line">🛰️ Satélites: <strong>${sats}</strong></span>
      <span class="popup-line">📐 HDOP/Precisión: <strong>${hdop.toFixed(2)}</strong> ${goodFix?'✅':'⚠️'}</span>
      <span class="popup-line">⚓ Estado: <strong>${anchorActive?'Anclado/Quieto':'En movimiento'}</strong></span>
      <span class="popup-line">🕐 Actualizado: <strong>${hora}</strong></span>
    </div>
  `);

  // Centrar mapa
  const pos = [lat, lon];
  if(!lastLatLng) map.setView(pos, 16);
  else if(followEnabled) map.panTo(pos, { animate:true, duration:0.4 });
  lastLatLng = pos;

  // Agregar al recorrido
  addToTrail(lat, lon, speedKmh);

  // Actualizar modal de información
  renderInfoModal(d);
}

// ─── Modal de información detallada ─────────────────────────────
const infoOverlay = document.getElementById("infoOverlay");
let infoOpen = false;

function renderInfoModal(d) {
  if(!infoOpen) return;
  const lat = safeNum(d.lat, 7);
  const lon = safeNum(d.lon, 7);
  const rawLat = safeNum(d.raw_lat, 7);
  const rawLon = safeNum(d.raw_lon, 7);
  const speed = kmh(d.speed_kmh);
  const alt = isFinite(Number(d.alt_m)) ? `${Number(d.alt_m).toFixed(1)} m` : "--";
  const sats = safeVal(d.satelites);
  const hdop = safeNum(d.hdop, 2);
  const course = isFinite(Number(d.course_deg)) ? `${Number(d.course_deg).toFixed(1)}°` : "--";
  const goodFix = Boolean(d.good_fix);
  const anchor = boolSiNo(d.anchor_active);
  const hora = safeVal(d.hora_ecuador);

  document.getElementById("infoPos").innerHTML = `
    <div class="infoLine">Filtrada: ${lat}</div>
    <div class="infoLine">Filtrada: ${lon}</div>
    <div class="infoLine">Bruta: ${rawLat}</div>
    <div class="infoLine">Bruta: ${rawLon}</div>
    <div class="infoLine">Altura: ${alt}</div>
  `;
  document.getElementById("infoSignal").innerHTML = `
    <div class="infoLine">Satélites: ${sats}</div>
    <div class="infoLine">HDOP: ${hdop}</div>
    <div class="infoLine">Calidad: <span class="${goodFix?'good-fix':'bad-fix'}">${goodFix?'Excelente ✅':'Regular ⚠️'}</span></div>
  `;
  document.getElementById("infoMove").innerHTML = `
    <div class="infoLine">Velocidad: ${speed}</div>
    <div class="infoLine">Rumbo: ${course}</div>
    <div class="infoLine">Anclado: ${anchor}</div>
  `;
  document.getElementById("infoSys").innerHTML = `
    <div class="infoLine">Hora: ${hora}</div>
    <div class="infoLine">Ruta: Recolector/Otavalo/Vehiculo1</div>
  `;
}

document.getElementById("btnInfo").addEventListener("click", () => {
  soundInfoOpen();
  infoOpen = true;
  infoOverlay.style.display = "flex";
  infoOverlay.setAttribute("aria-hidden", "false");
  if(latestData) renderInfoModal(latestData);
});
document.getElementById("infoClose").addEventListener("click", () => {
  soundInfoClose();
  infoOpen = false;
  infoOverlay.style.display = "none";
  infoOverlay.setAttribute("aria-hidden", "true");
});
infoOverlay.addEventListener("click", e => { if(e.target === infoOverlay) { infoOpen=false; infoOverlay.style.display="none"; } });
window.addEventListener("keydown", e => { if(e.key==="Escape" && infoOpen) { infoOpen=false; infoOverlay.style.display="none"; } });

// ─── Recargar / Reinicio remoto ─────────────────────────────────
document.getElementById("btnReload").addEventListener("click", async () => {
  soundReload();
  try { await set(ref(db, "Control/restart_ts"), Date.now()); } catch(e) {}
  setTimeout(() => location.reload(), 200);
});

// ─── 🔴 ESCUCHA FIREBASE — RUTA CORREGIDA ✅ ─────────────────────
// Escucha exactamente donde tu ESP32 escribe
const vehicleRef = ref(db, `${VEHICLE_BASE_PATH}1`);

onValue(vehicleRef, (snapshot) => {
  const data = snapshot.val();
  if(!data) {
    console.log("⚠️ Sin datos en Firebase — revisa la ruta del ESP32");
    document.getElementById("busState").textContent = "Sin conexión";
    return;
  }
  console.log("✅ Datos recibidos:", data); // Ver en consola del navegador
  renderBusData(data);
});

console.log("🚀 Mapa listo — escuchando:", `${VEHICLE_BASE_PATH}1`);
</script>
