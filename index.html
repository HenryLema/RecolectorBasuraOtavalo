<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Basura Otavalo</title>

  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://recolectorbasuraotavalo-default-rtdb.firebaseio.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://a.tile.openstreetmap.org">
  <link rel="dns-prefetch" href="https://b.tile.openstreetmap.org">
  <link rel="dns-prefetch" href="https://c.tile.openstreetmap.org">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      box-shadow: none !important;
      text-shadow: none !important;
      -webkit-box-shadow: none !important;
      filter: none !important;
      -webkit-filter: none !important;
      border: none !important;
      border-color: transparent !important;
    }

    html, body {
      height: 100%; width: 100%;
      margin: 0; padding: 0;
      font-family: Arial, sans-serif;
      font-size: 13px;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    #map { position: fixed; inset: 0; z-index: 0; }

    #top {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      padding: clamp(4px,1.5vw,8px) clamp(6px,2vw,12px);
      background: transparent;
      pointer-events: none;
    }
    #top > * { pointer-events: auto; }

    #topRow {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: clamp(4px,1.2vw,7px);
    }

    .chip {
      display: inline-flex;
      align-items: center;
      height: clamp(26px,5vw,34px);
      padding: 0 clamp(6px,1.8vw,11px);
      border-radius: 10px;
      font-size: clamp(10px,1.8vw,12px);
      background: rgba(255,255,255,.88);
      white-space: nowrap;
      line-height: 1;
      cursor: default;
      user-select: none;
    }

    button.chip {
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    button.chip:active { background: rgba(210,210,210,.95); transform: scale(.97); }
    button.chip:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    .title-chip {
      height: auto;
      min-height: clamp(26px,5vw,34px);
      padding: clamp(3px,1vw,5px) clamp(6px,1.8vw,11px);
      white-space: normal;
      word-break: break-word;
      line-height: 1.25;
      max-width: 100%;
    }

    .busstate-pill {
      display: inline-block;
      padding: 1px clamp(5px,1.5vw,8px);
      border-radius: 8px;
      color: #fff;
      font-size: clamp(10px,1.8vw,12px);
      line-height: 1.4;
    }
    .busstate-pill.moving  { background: #008000; }
    .busstate-pill.stopped { background: #cc0000; }

    .bus-wrap { width: 22px; height: 22px; border-radius: 50%; }
    .bus-wrap.moving  { background: #008000; }
    .bus-wrap.stopped { background: #cc0000; }

    .stop-icon {
      font-size: clamp(22px,4vw,32px);
      transform: translate(-50%,-50%);
      display: block; line-height: 1;
    }

    #map.draw-mode { cursor: crosshair !important; }

    #drawHint {
      position: fixed;
      bottom: clamp(60px,10vw,80px);
      left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.62);
      color: #fff;
      font-size: clamp(11px,2vw,13px);
      padding: 5px 14px;
      border-radius: 10px;
      z-index: 1500;
      pointer-events: none;
      display: none;
      white-space: nowrap;
    }

    #toast {
      position: fixed;
      bottom: clamp(60px,10vw,80px);
      left: 50%; transform: translateX(-50%);
      background: rgba(30,30,30,0.88);
      color: #fff;
      font-size: clamp(11px,2vw,13px);
      padding: 7px 18px;
      border-radius: 12px;
      z-index: 3000;
      pointer-events: none;
      display: none;
      text-align: center;
      max-width: 90vw;
      white-space: normal;
    }

    @keyframes pulse-ring {
      0%   { transform: translate(-50%,-50%) scale(0.7); opacity: 0.45; }
      70%  { transform: translate(-50%,-50%) scale(1.55); opacity: 0.12; }
      100% { transform: translate(-50%,-50%) scale(0.7); opacity: 0.45; }
    }
    @keyframes pulse-core {
      0%,100% { transform: translate(-50%,-50%) scale(1);    opacity: 0.92; }
      50%      { transform: translate(-50%,-50%) scale(0.82); opacity: 0.70; }
    }
    .solicitud-ring {
      width: 52px; height: 52px;
      border-radius: 50%;
      position: absolute;
      animation: pulse-ring 1.4s ease-in-out infinite;
      pointer-events: none;
    }
    .solicitud-core {
      width: 22px; height: 22px;
      border-radius: 50%;
      position: absolute;
      animation: pulse-core 1.4s ease-in-out infinite;
      cursor: pointer;
    }
    .solicitud-timer {
      position: absolute;
      top: -18px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.55);
      color: #fff; font-size: 10px;
      font-family: Arial, sans-serif;
      padding: 1px 5px; border-radius: 6px;
      white-space: nowrap; pointer-events: none;
    }

    .leaflet-bar, .leaflet-bar a,
    .leaflet-touch .leaflet-bar, .leaflet-touch .leaflet-bar a,
    .leaflet-control-attribution { border: none !important; }
    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: #fff !important;
      color: #000 !important;
    }
    .leaflet-popup-close-button {
      display: block !important;
      visibility: visible !important;
      top: 3px !important; right: 3px !important;
      width: 24px !important; height: 24px !important;
      font: 20px/24px Arial, sans-serif !important;
      text-align: center !important;
      padding: 0 !important;
      color: #666 !important;
      z-index: 10;
      touch-action: manipulation;
    }
    .leaflet-popup-close-button:hover,
    .leaflet-popup-close-button:active { color: #000 !important; background: transparent !important; }
    .leaflet-marker-shadow { display: none !important; }
    .leaflet-popup-content { font-family: Arial,sans-serif !important; font-weight: normal !important; }
    .leaflet-marker-icon      { filter: none !important; -webkit-filter: none !important; }
    .leaflet-zoom-animated    { filter: none !important; -webkit-filter: none !important; }
    .leaflet-shadow-pane      { display: none !important; }
    .leaflet-marker-pane img  { filter: none !important; -webkit-filter: none !important; }

    .leaflet-top.leaflet-left  { display: none; }
    .leaflet-bottom.leaflet-right {
      bottom: clamp(12px,3vw,24px);
      right:  clamp(8px,2vw,14px);
    }

    .popup-wrap      { width: clamp(130px,35vw,170px); font-family: Arial,sans-serif; }
    .stop-popup-wrap { width: clamp(140px,38vw,180px); font-family: Arial,sans-serif; }

    .popup-title, .popup-line,
    .stop-popup-title, .stop-popup-line {
      display: block; color: #000; font-weight: normal;
      font-size: clamp(10px,2vw,12px); line-height: 1.3; margin: 3px 0;
    }
    .popup-title, .stop-popup-title { text-align: center; margin: 0 0 5px; }
    .popup-val { font-weight: normal; }
    .popup-val.moving  { color: #008000; }
    .popup-val.stopped { color: #cc0000; }

    #infoOverlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.28);
      display: none; align-items: center; justify-content: center;
      z-index: 2000; padding: clamp(8px,3vw,20px);
    }
    #infoModal {
      width: 100%;
      max-width: min(780px, calc(100vw - 16px));
      max-height: calc(100vh - 32px);
      overflow-y: auto; background: #fff;
      border-radius: clamp(10px,2vw,16px);
      padding: clamp(8px,2vw,14px) clamp(10px,2.5vw,16px);
      font-family: Arial,sans-serif; font-size: clamp(11px,1.8vw,13px);
      color: #000; -webkit-overflow-scrolling: touch;
    }
    #infoTopRow {
      display: flex; align-items: center;
      justify-content: space-between;
      gap: 10px; margin-bottom: clamp(6px,1.5vw,10px);
    }
    #infoTitle  { font-size: clamp(11px,1.8vw,13px); font-weight: normal; opacity: .9; }
    #infoClose  {
      width: 28px; height: 28px; padding: 0;
      background: transparent; color: #666;
      font: 22px/28px Arial, sans-serif; text-align: center;
      cursor: pointer; user-select: none; flex-shrink: 0;
      touch-action: manipulation;
    }
    #infoGrid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: clamp(8px,2vw,14px);
    }
    @media (max-width:480px) { #infoGrid { grid-template-columns: 1fr; } }
    .infoCol {
      border-radius: clamp(8px,1.5vw,12px);
      padding: clamp(7px,1.5vw,11px); background: #fff;
    }
    .infoColTitle {
      text-align: center; font-size: clamp(11px,1.8vw,13px);
      font-weight: normal; margin: 0 0 7px;
    }
    .infoLine {
      font-size: clamp(10px,1.7vw,12px); font-weight: normal; margin: 3px 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    #map, .chip, .stop-icon { touch-action: manipulation; }
  </style>
</head>

<body>
  <div id="top">
    <div id="topRow">
      <div class="chip title-chip">♻️ Recolector Basura Otavalo</div>
      <div class="chip">⏱️ Hora: <span id="hora" style="margin-left:3px">--</span></div>
      <div class="chip">🚦 Estado:&nbsp;<span id="busState" class="busstate-pill stopped">Detenido</span></div>
      <button id="btnReload"      class="chip">🔄 Recargar</button>
      <button id="btnToggleTrail" class="chip">🟢 Recorrido: Si</button>
      <button id="btnInfo"        class="chip">ℹ️ Info</button>
      <button id="btnDibujar"     class="chip">📊 Calcular</button>
    </div>
  </div>

  <div id="map"></div>
  <div id="drawHint">👇 Agregar Punto</div>
  <div id="toast"></div>

  <div id="infoOverlay" aria-hidden="true">
    <div id="infoModal" role="dialog" aria-modal="true">
      <div id="infoTopRow">
        <div id="infoTitle">📱 Tiempo Real</div>
        <button id="infoClose" aria-label="Cerrar">×</button>
      </div>
      <div id="infoGrid">
        <div class="infoCol">
          <div class="infoColTitle">🚚 Recolector</div>
          <div id="infoMovil"></div>
        </div>
        <div class="infoCol">
          <div class="infoColTitle">📊 Central</div>
          <div id="infoFijo"></div>
        </div>
      </div>
    </div>
  </div>

<script type="module">
import { initializeApp }                          from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import { getDatabase, ref, onValue, set, push,
         remove, serverTimestamp, goOffline, goOnline } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-database.js";

// ─── Toast ────────────────────────────────────────────────────
let _toastTimer = null;
function showToast(msg, durationMs=4000) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.display = "block";
  if(_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.style.display="none"; }, durationMs);
}

// ─── Identificador de usuario ─────────────────────────────────
function getUserId() {
  let uid = localStorage.getItem("rbo_uid");
  if(!uid) {
    uid = "u_" + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
    localStorage.setItem("rbo_uid", uid);
  }
  return uid;
}
const MY_UID = getUserId();

// ─── Firebase ─────────────────────────────────────────────────
const firebaseConfig = {
  apiKey:            "AIzaSyCZP36RLL7SEWvyLApKKFJzjjssNRe-_LE",
  authDomain:        "recolectorbasuraotavalo.firebaseapp.com",
  databaseURL:       "https://recolectorbasuraotavalo-default-rtdb.firebaseio.com",
  projectId:         "recolectorbasuraotavalo",
  storageBucket:     "recolectorbasuraotavalo.firebasestorage.app",
  messagingSenderId: "900064792007",
  appId:             "1:900064792007:web:c88637de46577aed87dde2"
};
const db = getDatabase(initializeApp(firebaseConfig));

// ─── Conectividad (móviles / portátiles) ──────────────────────
let fbConnected = false, wasDisconnected = false, _offTimer = null, _hiddenAt = 0;
onValue(ref(db, ".info/connected"), snap => {
  fbConnected = snap.val() === true;
  if(fbConnected){
    clearTimeout(_offTimer); _offTimer = null;
    if(wasDisconnected){ wasDisconnected = false; showToast("✅ Conexión restablecida", 2500); }
  } else if(!_offTimer){
    _offTimer = setTimeout(() => {
      _offTimer = null;
      if(!fbConnected){ wasDisconnected = true; showToast("📡 Sin conexión, reconectando…", 6000); }
    }, 5000);
  }
});
function reconectar(force){
  if(fbConnected && !force) return;
  try { goOffline(); goOnline(); } catch(e) {}
}
window.addEventListener("online", () => reconectar(false));
window.addEventListener("pageshow", e => { if(e.persisted) reconectar(true); });
document.addEventListener("visibilitychange", () => {
  if(document.hidden){ _hiddenAt = Date.now(); return; }
  reconectar(Date.now() - _hiddenAt > 60000);
});

// ─── Mapa ─────────────────────────────────────────────────────
const map = L.map("map", {
  zoomControl:false, tap:true, tapTolerance:15, preferCanvas:true
}).setView([0.23299010950077462,-78.26316758796887],14);

L.Popup.mergeOptions({closeButton:true});
L.control.zoom({position:"bottomright"}).addTo(map);
map.attributionControl.setPrefix("🪐 Red Otavalo");
const _conn = navigator.connection || {};
const _slowNet = !!_conn.saveData || /(^|slow-)2g|3g/.test(_conn.effectiveType || "");
const tiles = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19, detectRetina:!_slowNet, updateWhenZooming:false
}).addTo(map);
tiles.on("tileerror", e => {
  const t = e.tile;
  t._retry = (t._retry || 0) + 1;
  if(t._retry > 2) return;
  setTimeout(() => { if(t.isConnected && navigator.onLine !== false) t.src = t.src; }, 1500 * t._retry);
});

map.on("popupopen", e =>
  setTimeout(()=>{ if(map.hasLayer(e.popup)) map.closePopup(e.popup); },60000)
);

// ─── Recargar ─────────────────────────────────────────────────
document.getElementById("btnReload").addEventListener("click", async () => {

  try { await set(ref(db,"Control/restart_ts"), Date.now()); } catch(e) {}
  setTimeout(()=>location.reload(), 200);
});

// ─── Info modal ───────────────────────────────────────────────
const infoOverlay = document.getElementById("infoOverlay");
const infoMovilEl = document.getElementById("infoMovil");
const infoFijoEl  = document.getElementById("infoFijo");
let infoOpen=false, latestFijoData=null, latestBusData=null;

const safeNum    = (v,d=6) => { const n=Number(v); return isFinite(n)?n.toFixed(d):"--"; };
const safeVal    = v => (v===undefined||v===null||v===""||
                         (typeof v==="number"&&!isFinite(v)))?"--":String(v);
const makeLines  = a => a.map(t=>`<div class="infoLine">${t}</div>`).join("");
const boolToSiNo = v => {
  if(v===true||v==="true"||v==="TRUE"||v==="True")    return "Si";
  if(v===false||v==="false"||v==="FALSE"||v==="False") return "No";
  return "--";
};

function renderInfo() {
  const m=latestBusData||{}, f=latestFijoData||{};
  const movilVel=(m.speed_kmh!==undefined&&isFinite(Number(m.speed_kmh)))
    ?`${Number(m.speed_kmh).toFixed(1)} km/h`:"--";
  const altRaw=[m.altura,m.alt,m.altitud,m.altitude,m.alt_m,m.altura_m]
    .find(v=>v!==undefined&&v!==null&&v!==""&&isFinite(Number(v)));
  const movilAlt=altRaw!==undefined?`${Number(altRaw).toFixed(1)} m`:"--";
  infoMovilEl.innerHTML=makeLines([
    `⏱️ Hora: ${safeVal(m.hora_ecuador)}`,
    `📍 Latitud: ${m.lat!==undefined?safeNum(m.lat,6):"--"}`,
    `📍 Longitud: ${m.lon!==undefined?safeNum(m.lon,6):"--"}`,
    `⛰️ Altura: ${movilAlt}`,
    `🛰️ Satélites: ${safeVal(m.satelites)}`,
    `🚀 Velocidad: ${movilVel}`,
    `🎯 Precisión: ${safeVal(m.hdop)}`
  ]);
  let fijoFlag="--";
  if(f.fijo_ok!==undefined) fijoFlag=boolToSiNo(f.fijo_ok);
  else if(f.fix!==undefined) fijoFlag=boolToSiNo(f.fix);
  infoFijoEl.innerHTML=makeLines([
    `⏱️ Hora: ${safeVal(f.hora_ecuador)}`,
    `📍 Latitud: ${f.lat!==undefined?safeNum(f.lat,6):"--"}`,
    `📍 Longitud: ${f.lon!==undefined?safeNum(f.lon,6):"--"}`,
    `🛰️ Satélites: ${safeVal(f.satelites)}`,
    `⚓ Fijo: ${fijoFlag}`,
    `🎯 Precisión: ${safeVal(f.hdop)}`
  ]);
}
function openInfo()  {infoOpen=true;  renderInfo(); infoOverlay.style.display="flex";  infoOverlay.setAttribute("aria-hidden","false"); }
function closeInfo() {infoOpen=false; infoOverlay.style.display="none"; infoOverlay.setAttribute("aria-hidden","true"); }

document.getElementById("btnInfo").addEventListener("click",  e=>{ e.preventDefault(); openInfo(); });
document.getElementById("infoClose").addEventListener("click", closeInfo);
infoOverlay.addEventListener("click", e=>{ if(e.target===infoOverlay) closeInfo(); });
window.addEventListener("keydown", e=>{ if(e.key==="Escape"&&infoOpen) closeInfo(); });

// ─── Iconos bus/parada ────────────────────────────────────────
const stopIcon = L.divIcon({
  className:"", html:'<span class="stop-icon">🚮</span>',
  iconSize:[36,36], iconAnchor:[18,18]
});
const BUS_ICONS=[false,true].map(m=>L.divIcon({
  className:"", html:`<div class="bus-wrap ${m?"moving":"stopped"}"></div>`,
  iconSize:[22,22], iconAnchor:[11,11]
}));
let busIsMoving=false;
const busMarker=L.marker([0,0],{icon:BUS_ICONS[0]}).addTo(map);

function buildBusPopupHtml(speedKmh,isMoving) {
  return `<div class="popup-wrap">
    <span class="popup-title">🚚 Recolector</span>
    <span class="popup-line">🚀 Velocidad: <span class="popup-val ${isMoving?"moving":"stopped"}">${Number(speedKmh||0).toFixed(1)} km/h</span></span>
    <span class="popup-line">🚦 Estado: <span class="popup-val ${isMoving?"moving":"stopped"}">${isMoving?"Movimiento":"Detenido"}</span></span>
  </div>`;
}
busMarker.bindPopup(buildBusPopupHtml(0,false));
busMarker.on("popupopen",()=>{pauseFollowFor(); });

// ─── Auto-follow ──────────────────────────────────────────────
const FOLLOW_RESUME_MS=60000;
let followEnabled=true, followTimer=null, lastLatLng=null;
// Los movimientos hechos por el propio código NO deben pausar el seguimiento
let progMove=false, progTimer=null;
function progView(fn){
  progMove=true; clearTimeout(progTimer);
  fn();
  progTimer=setTimeout(()=>{ progMove=false; },900);
}
function pauseFollowFor(ms=FOLLOW_RESUME_MS) {
  followEnabled=false;
  if(followTimer) clearTimeout(followTimer);
  followTimer=setTimeout(()=>{
    followEnabled=true;
    if(lastLatLng) progView(()=>map.setView(lastLatLng,map.getZoom(),{animate:true,duration:0.6}));
  },ms);
}
const _userMove=()=>{ if(!progMove) pauseFollowFor(); };
map.on("zoomstart",_userMove);
map.on("zoom",     _userMove);
map.on("dragstart",()=>{ if(!drawMode) pauseFollowFor(); });
map.on("movestart",_userMove);

// ─── Ruta verde ───────────────────────────────────────────────
const trailLatLngs=[], MAX_POINTS=2500;
const TRAIL_STYLE={color:"green",weight:5,opacity:0.9,smoothFactor:2,interactive:false};
// Restaura el recorrido guardado (si se recarga la página o el celular descarta la pestaña)
const TRAIL_KEY="rbo_trail_v2", TRAIL_MAX_AGE_MS=60*60*1000;
try{
  const s=JSON.parse(localStorage.getItem(TRAIL_KEY)||"null");
  if(s&&Array.isArray(s.p)&&Date.now()-s.t<=TRAIL_MAX_AGE_MS)
    s.p.forEach(q=>{ if(Array.isArray(q)&&isFinite(q[0])&&isFinite(q[1])) trailLatLngs.push(q); });
}catch(e){}
const trailLine=L.polyline(trailLatLngs,TRAIL_STYLE).addTo(map);
const trailHead=L.polyline([],          TRAIL_STYLE).addTo(map);
let _trailDirty=false;
setInterval(()=>{
  if(!_trailDirty) return;
  _trailDirty=false;
  try{
    localStorage.setItem(TRAIL_KEY,JSON.stringify({t:Date.now(),
      p:trailLatLngs.slice(-1200).map(q=>[+q[0].toFixed(6),+q[1].toFixed(6)])}));
  }catch(e){}
},15000);
let trailVisible=true;

document.getElementById("btnToggleTrail").addEventListener("click",e=>{
  trailVisible=!trailVisible;
  if(trailVisible){

    trailLine.setLatLngs(trailLatLngs);
    if(!map.hasLayer(trailLine)) trailLine.addTo(map);
    if(!map.hasLayer(trailHead)) trailHead.addTo(map);
    e.target.textContent="🟢 Recorrido: Si";
  } else {

    if(map.hasLayer(trailLine)) map.removeLayer(trailLine);
    if(map.hasLayer(trailHead)) map.removeLayer(trailHead);
    e.target.textContent="🔴 Recorrido: No";
  }
});

// ─── Util ─────────────────────────────────────────────────────
function haversineMeters(lat1,lon1,lat2,lon2) {
  const R=6371000,toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function formatDist(m) {
  if(!isFinite(m)||m<=0) return "--";
  return (m<1000)?`${m.toFixed(0)} m`:`${(m/1000).toFixed(2)} km`;
}
function formatETA(sec) {
  if(!isFinite(sec)||sec<=0) return "--";
  const m=Math.round(sec/60);
  if(m<1)  return "< 1 min";
  if(m<60) return `${m} min`;
  return `${Math.floor(m/60)} h ${m%60} min`;
}
const ema  = (p,x,a) => p==null?x:a*x+(1-a)*p;
const ema2 = (p,x,a) => !p?x:[ema(p[0],x[0],a),ema(p[1],x[1],a)];

// ─── ETA ──────────────────────────────────────────────────────
const ROUTE_FACTOR=1.45,ETA_BIAS_SEC=45,DEFAULT_SPEED_KMH=4.5;
const SPEED_ALPHA=0.35,MIN_USABLE_SPEED_KMH=2.0,MAX_REASONABLE_SPEED_KMH=55;
let speedSmoothed=null,lastGoodSpeed=null;

function pickSpeedKmh(rawSpeedKmh) {
  let s=Number(rawSpeedKmh||0);
  if(!isFinite(s)||s<0) s=0;
  if(s>MAX_REASONABLE_SPEED_KMH) s=MAX_REASONABLE_SPEED_KMH;
  speedSmoothed=ema(speedSmoothed,s,SPEED_ALPHA);
  if(isFinite(speedSmoothed)&&speedSmoothed>=MIN_USABLE_SPEED_KMH) lastGoodSpeed=speedSmoothed;
  if(isFinite(speedSmoothed)&&speedSmoothed>=MIN_USABLE_SPEED_KMH) return speedSmoothed;
  if(isFinite(lastGoodSpeed)&&lastGoodSpeed>=MIN_USABLE_SPEED_KMH) return lastGoodSpeed;
  return DEFAULT_SPEED_KMH;
}
function calcEtaSeconds(distStraightM,usedSpeedKmh) {
  return (distStraightM*ROUTE_FACTOR/Math.max(usedSpeedKmh/3.6,0.1))+ETA_BIAS_SEC;
}

// ─── Snap a calle ─────────────────────────────────────────────
const SNAP_MIN_MOVE_M=10,SNAP_MAX_ERR_M=35,SNAP_TTL_MS=15000;
const snapCache=new Map();
let lastSnapRaw=null,lastSnapped=null,snapPending=false;
const snapKey=(lat,lon)=>`${lat.toFixed(5)},${lon.toFixed(5)}`;

async function snapToRoad(lat,lon) {
  const k=snapKey(lat,lon);
  if(snapCache.has(k)) return snapCache.get(k);
  const ac=new AbortController(), to=setTimeout(()=>ac.abort(),4000);
  let j;
  try{
    const r=await fetch(`https://router.project-osrm.org/nearest/v1/driving/${lon},${lat}?number=1`,{signal:ac.signal});
    if(!r.ok) throw 0;
    j=await r.json();
  } finally { clearTimeout(to); }
  const loc=j?.waypoints?.[0]?.location;
  if(!loc) throw 0;
  const pt=[loc[1],loc[0]];
  snapCache.set(k,pt); return pt;
}
let snapFails=0, snapPausedUntil=0;
function maybeRequestSnap(rawLat,rawLon) {
  if(snapPending||_slowNet||Date.now()<snapPausedUntil) return;
  if(!lastSnapRaw) lastSnapRaw=[rawLat,rawLon];
  if(haversineMeters(lastSnapRaw[0],lastSnapRaw[1],rawLat,rawLon)<SNAP_MIN_MOVE_M) return;
  snapPending=true;
  const rLat=rawLat,rLon=rawLon;
  lastSnapRaw=[rawLat,rawLon];
  snapToRoad(rLat,rLon).then(pt=>{
    snapFails=0;
    if(haversineMeters(rLat,rLon,pt[0],pt[1])<=SNAP_MAX_ERR_M) lastSnapped={pt,t:Date.now()};
  }).catch(()=>{
    if(++snapFails>=3){ snapFails=0; snapPausedUntil=Date.now()+120000; }
  }).finally(()=>{ snapPending=false; });
}
function pickRoadPoint(rawLat,rawLon) {
  maybeRequestSnap(rawLat,rawLon);
  if(lastSnapped&&(Date.now()-lastSnapped.t)<=SNAP_TTL_MS) {
    if(haversineMeters(rawLat,rawLon,lastSnapped.pt[0],lastSnapped.pt[1])<=SNAP_MAX_ERR_M)
      return lastSnapped.pt;
  }
  return [rawLat,rawLon];
}

// ─── Filtro / ruta ────────────────────────────────────────────
const SMOOTH_ALPHA_POS = 0.60;
// ✅ CORRECCIÓN CLAVE: umbral mínimo de distancia para agregar punto al trail
const MIN_ADD_DIST_M   = 15;   // era 3 — evita garabatos en reposo
const MAX_JUMP_DRAW_M  = 150;  // era 200

// ✅ NUEVO: umbral de velocidad para considerar el vehículo detenido (JS)
const STOPPED_SPEED_KMH   = 3.0;
// ✅ NUEVO: cuántos ciclos consecutivos quieto antes de congelar el trail
const STOPPED_FREEZE_CYCLES = 2;
let   stoppedCycleCount     = 0, movingCycleCount = 0;
let   trailFrozen           = false;  // cuando es true, no se agregan puntos

let lastStableDraw=null,lastSmoothed=null,jumpRejects=0;

function pushTrail(latLng) {
  trailLatLngs.push(latLng);
  _trailDirty=true;
  if(trailLatLngs.length>MAX_POINTS){
    trailLatLngs.splice(0,trailLatLngs.length-MAX_POINTS);
    if(trailVisible) trailLine.setLatLngs(trailLatLngs);
  } else if(trailVisible) trailLine.addLatLng(latLng);
}
function stablePoint(lat,lon) {
  const p=[lat,lon];
  if(!lastStableDraw){lastStableDraw=p;return p;}
  if(haversineMeters(lastStableDraw[0],lastStableDraw[1],p[0],p[1])>MAX_JUMP_DRAW_M){
    // Glitch aislado de GPS: se ignora. Si se repite 3 ciclos seguidos, es movimiento real.
    if(++jumpRejects<3) return lastStableDraw;
    lastSmoothed=null;
  }
  jumpRejects=0;
  lastStableDraw=p; return p;
}

// ─── Segmentos por calle (OSRM route): curvas redondas que siguen la calle ───
let routePending=false, routeFails=0, routePausedUntil=0;
async function routeSegment(a,b){
  const ac=new AbortController(), to=setTimeout(()=>ac.abort(),4000);
  try{
    const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${a[1]},${a[0]};${b[1]},${b[0]}?overview=full&geometries=geojson`,{signal:ac.signal});
    if(!r.ok) throw 0;
    const rt=(await r.json())?.routes?.[0];
    if(!rt) throw 0;
    const pts=rt.geometry.coordinates.map(c=>[c[1],c[0]]);
    const d=haversineMeters(a[0],a[1],b[0],b[1]), e=pts[pts.length-1];
    // Descarta desvíos raros (sentido único, calle paralela): se usa línea recta
    if(rt.distance>d*1.6+25 || haversineMeters(e[0],e[1],b[0],b[1])>SNAP_MAX_ERR_M) return null;
    return pts.slice(1);
  } finally { clearTimeout(to); }
}
function addTrailSegment(last,p){
  if(_slowNet||Date.now()<routePausedUntil){ pushTrail(p); return; }
  if(routePending) return;
  routePending=true;
  routeSegment(last,p)
    .then(pts=>{ routeFails=0; if(pts&&pts.length) pts.forEach(pushTrail); else pushTrail(p); })
    .catch(()=>{ pushTrail(p); if(++routeFails>=3){ routeFails=0; routePausedUntil=Date.now()+120000; } })
    .finally(()=>{ routePending=false; });
}

// ✅ Trail: sin rayas en reposo + curvas que siguen la calle
function updateGreenTrailForced(rawLat, rawLon, rawSpeedKmh) {
  const speedKmh = Number(rawSpeedKmh || 0);
  const last  = trailLatLngs.length ? trailLatLngs[trailLatLngs.length - 1] : null;
  const dLast = last ? haversineMeters(last[0], last[1], rawLat, rawLon) : 0;
  const slow  = speedKmh < STOPPED_SPEED_KMH;

  if (slow) { stoppedCycleCount++; movingCycleCount = 0; }
  else      { movingCycleCount++;  stoppedCycleCount = 0; }
  if (stoppedCycleCount >= STOPPED_FREEZE_CYCLES) trailFrozen = true;
  // Salir de reposo: 2 lecturas seguidas en movimiento, o alejarse de verdad (>35 m)
  if (trailFrozen && (movingCycleCount >= 2 || dLast > 35)) { trailFrozen = false; lastSmoothed = null; }

  // En reposo (o velocidad baja sin desplazamiento real): no se dibuja nada, se ignora el ruido GPS
  if (last && (trailFrozen || (slow && dLast < 35))) {
    if (trailVisible) trailHead.setLatLngs([last, last]);
    lastSmoothed = null;
    return;
  }

  const p0 = stablePoint(rawLat, rawLon);
  lastSmoothed = ema2(lastSmoothed, p0, SMOOTH_ALPHA_POS);
  const p = lastSmoothed;

  if (!last) pushTrail(p);
  else if (haversineMeters(last[0], last[1], p[0], p[1]) >= MIN_ADD_DIST_M) addTrailSegment(last, p);

  const h = trailLatLngs[trailLatLngs.length - 1];
  if (trailVisible) trailHead.setLatLngs(haversineMeters(h[0], h[1], rawLat, rawLon) < 60 ? [h, [rawLat, rawLon]] : [h, h]);
}

function applyBusDataToUIAndMap(d) {
  const lat=Number(d.lat||0),lon=Number(d.lon||0);
  if(!lat||!lon) return null;
  const rawSpeedKmh =Number(d.speed_kmh||0);
  const usedSpeedKmh=pickSpeedKmh(rawSpeedKmh);
  document.getElementById("hora").textContent=d.hora_ecuador??"--";
  setBusMovingState(rawSpeedKmh>=1.0);
  const busPos=[lat,lon];
  busMarker.setLatLng(busPos);
  if(!lastLatLng) progView(()=>map.setView(busPos,16));
  else if(followEnabled) progView(()=>map.panTo(busPos,{animate:true,duration:0.4}));
  lastLatLng=busPos;
  const ph=buildBusPopupHtml(rawSpeedKmh,busIsMoving);
  if(busMarker.getPopup()) busMarker.setPopupContent(ph);
  else busMarker.bindPopup(ph);
  return {lat,lon,rawSpeedKmh,usedSpeedKmh};
}

let activeSolicitudPopupKey = null;

function busTick(){
  if(!latestBusData) return;
  const info=applyBusDataToUIAndMap(latestBusData);
  if(!info) return;
  lastBusInfo=info;

  // ✅ Pasar velocidad cruda al trail para que detecte reposo
  updateGreenTrailForced(info.lat, info.lon, info.rawSpeedKmh);

  // Contenedores / NodoFijo
  if(activeStopId){
    if(activeStopId===NODO_FIJO_ID&&nodoFijoMarker){
      nodoFijoMarker.setPopupContent(buildNodoFijoPopupHtml(info.usedSpeedKmh));
    } else {
      const s=stops.find(x=>x.id===activeStopId);
      const m=stopMarkers.get(activeStopId);
      if(s&&m) m.setPopupContent(stopPopupHtml(s));
    }
  }

  if(busMarker.isPopupOpen())
    busMarker.setPopupContent(buildBusPopupHtml(info.rawSpeedKmh,busIsMoving));

  if(activeSolicitudPopupKey){
    const item=marcadoresActivos.get(activeSolicitudPopupKey);
    if(item && item.marker.isPopupOpen()){
      item.marker.setPopupContent(solicitudPopupHtml(activeSolicitudPopupKey,item.esMio,item.color,item.lat,item.lon));
    } else {
      activeSolicitudPopupKey=null;
    }
  }
}
setInterval(busTick,3000);

const SOLICITUD_TTL_MS = 10 * 60 * 1000;
const solicitudesRef   = ref(db, "Solicitudes");

const marcadoresActivos = new Map();

const COLORES_POOL = [
  "#e74c3c","#e67e22","#f1c40f","#2ecc71","#1abc9c",
  "#3498db","#9b59b6","#e91e63","#00bcd4","#ff5722",

  "#cddc39","#03a9f4","#ff4081","#76ff03","#40c4ff"
];
function colorForKey(key) {
  let hash=0;
  for(let i=0;i<key.length;i++) hash=(hash*31+key.charCodeAt(i))>>>0;
  return COLORES_POOL[hash % COLORES_POOL.length];
}

function formatCountdown(ms) {
  if(ms<=0) return "0:00";
  const s=Math.ceil(ms/1000);
  const m=Math.floor(s/60), ss=s%60;
  return `${m}:${String(ss).padStart(2,"0")}`;
}

function dibujarSolicitudEnMapa(fbKey, data) {
  if(marcadoresActivos.has(fbKey)) return;

  const { lat, lon, expireAt, uid } = data;
  const remaining = expireAt - Date.now();
  if(remaining <= 0) return;

  const color  = colorForKey(fbKey);
  const esMio  = (uid === MY_UID);

  const html = `
    <div style="position:relative;width:52px;height:52px;">
      <div class="solicitud-ring" style="background:${color};top:50%;left:50%;"></div>
      <div class="solicitud-core" style="background:${color};top:50%;left:50%;"></div>
      <div class="solicitud-timer" id="stimer-${fbKey}">
        ${formatCountdown(remaining)}
      </div>
    </div>`;

  const icon = L.divIcon({
    className:"", html,
    iconSize:[52,52], iconAnchor:[26,26]
  });

  const marker = L.marker([lat,lon],{icon,zIndexOffset:500}).addTo(map);

  marker.bindPopup(solicitudPopupHtml(fbKey, esMio, color, lat, lon));

  marker.on("popupopen", ()=>{
    activeSolicitudPopupKey = fbKey;
    pauseFollowFor();
    marker.setPopupContent(solicitudPopupHtml(fbKey, esMio, color, lat, lon));
  });
  marker.on("popupclose", ()=>{
    if(activeSolicitudPopupKey === fbKey) activeSolicitudPopupKey = null;
  });

  const tickerId = setInterval(()=>{
    const rem = expireAt - Date.now();
    const el  = document.getElementById(`stimer-${fbKey}`);
    if(el) el.textContent = formatCountdown(rem);
    if(rem <= 0) clearInterval(tickerId);
  },1000);

  const autoExpire = setTimeout(()=>{ quitarMarcador(fbKey); }, remaining+500);

  marcadoresActivos.set(fbKey, { marker, tickerId, autoExpire, lat, lon, esMio, color });
}

function quitarMarcador(fbKey) {
  const item = marcadoresActivos.get(fbKey);
  if(!item) return;
  marcadoresActivos.delete(fbKey);
  clearInterval(item.tickerId);
  clearTimeout(item.autoExpire);
  if(map.hasLayer(item.marker)) map.removeLayer(item.marker);
  if(activeSolicitudPopupKey===fbKey) activeSolicitudPopupKey=null;
}

onValue(solicitudesRef, snap => {
  const data = snap.val() || {};
  const claves = new Set(Object.keys(data));
  for(const [k,v] of Object.entries(data)){
    if(!marcadoresActivos.has(k)) dibujarSolicitudEnMapa(k, v);
  }
  for(const k of marcadoresActivos.keys()){
    if(!claves.has(k)) quitarMarcador(k);
  }
});

setInterval(async ()=>{
  try {
    const snap = await new Promise(res=>onValue(solicitudesRef,res,{onlyOnce:true}));
    const data = snap.val()||{};
    for(const [k,v] of Object.entries(data)){
      if(v.uid === MY_UID && v.expireAt <= Date.now()){
        await remove(ref(db,`Solicitudes/${k}`));
      }
    }
  } catch(e){}
},30000);

}

window._cancelarSolicitud = async function(fbKey) {
  map.closePopup();
  await remove(ref(db,`Solicitudes/${fbKey}`));
};

let drawMode=false;
const btnDibujar = document.getElementById("btnDibujar");
const drawHint   = document.getElementById("drawHint");
const mapEl      = document.getElementById("map");

function setDraw(on) {
  drawMode=on;
  btnDibujar.textContent=on?"📊 Cancelar":"📊 Calcular";
  mapEl.classList.toggle("draw-mode",on);
  drawHint.style.display=on?"block":"none";
  map.dragging[on?"disable":"enable"]();
  map.scrollWheelZoom[on?"disable":"enable"]();
  if(on) pauseFollowFor();
}

btnDibujar.addEventListener("click", ()=>setDraw(!drawMode));

map.on("click", async e=>{
  if(!drawMode) return;
  setDraw(false);
  await crearSolicitud(e.latlng.lat, e.latlng.lng);
});

window.addEventListener("keydown", e=>{ if(e.key==="Escape"&&drawMode) setDraw(false); });
</script>
</body>
</html>
